 ### Идеологические группы ###
 liberal_desc: "Демократический режим"
 social_democrat_desc: "Демократический режим"
 social_conservatism:0 "Социал-консерватизм"
 agrarianism:0 "Аграризм"
 social_liberalism:0 "Социал-либерализм"
 national_liberalism:0 "Национал-либерализм"
 economic_liberalism:0 "Экономический либерализм"
 democratic_socialism:0 "Демократический социализм"
 anarchist_syndicalist:0 "Анархо-синдикализм"

 ### Описание суб идеологий ###
 social_conservatism_desc:0 "По мнению приверженцев социального консерватизма, государство должно постоянно заботиться о благосостоянии населения и его росте, главным средством реализации социальных функций государства является эффективное развитие экономики на базе общих для современного консерватизма принципов, необходимым условием общественного прогресса является сохранение верности национальной культуре."
 agrarianism_desc:0 "Аграризм — это социальная или политическая философия, которая расценивает сельское общество как превосходящее общество городское, независимых фермеров как превосходящих получающих зарплату рабочих. В рамках этих философий фермерство рассматривается как образ жизни, способный сформировать идеальные социальные ценности. Они подчеркивают превосходство простой сельской жизни над сложной жизнью города с его банками и заводами."
 social_liberalism_desc:0 "По мнению социальных либералов, государство обязано вмешиваться в экономические процессы с целью борьбы с монополизмом и поддержания конкурентной рыночной среды."
 national_liberalism_desc:0 "Национал-либерализм может рассматриваться как разновидность гражданского национализма и национал-демократии, в котором, как правило, правый либерализм совмещается с анти-консервативным национализмом умеренного толка."
 economic_liberalism_desc:0 "Данная идеология отвергает государственное регулирование экономики и экономическое вмешательство в свободный рынок, и поддерживает полную и максимальную экономическую свободу, свободу торговли и конкуренции."
 democratic_socialism_desc:0 "Демократический социализм — политическая, социальная и экономическая философия и идеология, поддерживающая политическую демократию в общественной экономике, с особым упором на экономическую демократию, рабочую демократию и самоуправление работников."
 anarchist_syndicalist_desc:0 "Анархо-синдикалисты считают, что рабочие союзы должны действовать на основе принципа принятия решений всем коллективом, через общие собрания на местах."


 ### Описания идеологий ###
 fascism_subtype_desc: "Фашизм, охватывающий разнообразные ультранационалистические движения, обычно превозносит преданность государству и стремится объединить нацию под руководством сильного лидера."
 neutrality_subtype_desc: "Авторитаризм — это, во-первых, социально-политическая система, основанная на подчинении государству и его лидерам. Во-вторых — социальная установка или черта личности, характеризующаяся уверенностью в том, что в обществе должна существовать строгая и безусловная преданность правителю, беспрекословное подчинение людей авторитетам и властям."
 democratic_subtype_desc: "Консерваторы считают, что быстрые изменения идут только во вред обществу; они поддерживают традиционные ценности и выступают за умеренные реформы, иногда ратуя за возврат к старым добрым временам."
 liberal_subtype_desc: "Либерализм, основанный на давней философской традиции уважения личной свободы, считает защиту прав человека основной функцией государства."
 social_democrat_subtype_desc: "Социал-демократы проповедуют социальное равенство, добиваться которого призывают посредством реформ; по их мнению, общество должно ограничивать крайние проявления капитализма."
 communism_subtype_desc: "Согласно работам основоположников марксизма, коммунизм предполагает наличие высокоразвитых производительных сил, отсутствие государства, денег и деления общества на социальные классы."
 anarchism_subtype_desc: "Анархизм — отторжение всякой власти. Он пропагандирует разделение сообщества на самоуправляемые коллективы внутри единого централизованного государства."

